[project]
name = "signal-desk"
version = "0.1.0"
description = "Personal AI agent that reads stock news and writes a morning briefing."
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.14",
    "fastapi>=0.115",
    "psycopg[binary]>=3.2",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "pyyaml>=6.0",
    "sqlalchemy>=2.0.36",
    "typer>=0.15",
    "uvicorn[standard]>=0.32",
]

[project.scripts]
signal-desk = "app.cli:app"

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    # Embedded Postgres + pgvector for tests; no Docker needed.
    "pgserver>=0.1.4",
    "pytest>=8.3",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["app", "tests"]
known-third-party = ["alembic"]  # not the local alembic/ migrations folder

[tool.pytest.ini_options]
testpaths = ["tests"]
