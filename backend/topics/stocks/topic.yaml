# Signal Desk topic: Swedish and US stocks.
# Everything topic-specific lives here so the engine can run other topics later.

key: stocks
name: Stock news
description: Daily briefing on news moving Nasdaq Stockholm and US-listed stocks.
companies_file: companies.csv

markets:
  - key: SE
    name: Nasdaq Stockholm
    mics: [XSTO]
    timezone: Europe/Stockholm
    benchmark: OMXS30
  - key: US
    name: US exchanges
    mics: [XNAS, XNYS]
    timezone: America/New_York
    benchmark: S&P 500

# MFN carries Nordic releases in a dozen languages; the briefing reads these two.
article_languages: [en, sv]

# A source may only be enabled with a url and a terms_basis saying why we may use it
# (validated). We store headline + short excerpt, always link back, poll at most hourly,
# and never republish: the app is private.
sources:
  - key: mfn
    name: MFN (Modular Finance News)
    kind: press_wire
    fetcher: rss
    url: https://mfn.se/all/a.rss?limit=200
    market: SE
    language: sv  # items carry their own language; this is the fallback
    is_press_release: true
    enabled: true
    terms_basis: >-
      Public RSS feed offered by mfn.se for subscribing to listed companies' press
      releases, which issuers publish for public distribution. No feed restrictions
      published (checked 2026-10-04). Personal, private use; excerpt + link only.
  - key: cision-se
    name: Cision News Sweden
    kind: press_wire
    fetcher: rss
    url: https://news.cision.com/se/ListItems?format=rss&pageSize=100
    market: SE
    language: sv
    is_press_release: true
    enabled: true
    terms_basis: >-
      Public RSS feed offered by news.cision.com for press releases issuers publish
      for public distribution. No feed restrictions published; content policy
      (news.cision.com/se/_editorial/contentpolicy) covers publishers only (checked
      2026-10-04). Personal, private use; excerpt + link only.
  - key: sec-8k
    name: SEC EDGAR current 8-K filings
    kind: rss
    fetcher: atom
    url: https://www.sec.gov/cgi-bin/browse-edgar?action=getcurrent&type=8-K&company=&dateb=&owner=include&count=100&output=atom
    market: US
    language: en
    is_press_release: true
    enabled: true
    terms_basis: >-
      US government data, free to access and reuse. Fair-access rules
      (sec.gov/search-filings/edgar-search-assistance/accessing-edgar-data):
      declared User-Agent with contact email (SEC_USER_AGENT), max 10 requests/s.
  - key: finnhub-news
    name: Finnhub company news
    kind: api
    fetcher: finnhub_company_news
    url: https://finnhub.io/api/v1/company-news
    market: US
    language: en
    enabled: true
    terms_basis: >-
      Finnhub free API plan: personal, non-commercial use, 60 calls/min, no
      redistribution (finnhub.io/terms-of-service). One call per tracked US stock
      per run. Articles belong to their outlets; we keep headline + summary + link.

event_types:
  - {key: profit_warning, label: Profit warning, importance: 1.0}
  - {key: takeover_bid, label: Takeover bid, importance: 1.0}
  - {key: trial_result, label: Clinical trial result, importance: 0.9}
  - {key: earnings, label: Earnings report, importance: 0.8}
  - {key: guidance, label: Guidance change, importance: 0.8}
  - {key: acquisition, label: Acquisition, importance: 0.7}
  - {key: regulatory, label: Regulatory decision, importance: 0.7}
  - {key: capital_raise, label: Share issue / capital raise, importance: 0.7}
  - {key: contract, label: Major contract / order, importance: 0.6}
  - {key: investment, label: Strategic investment / financing deal / partnership, importance: 0.6}
  - {key: operations, label: Production / supply chain / outage / recall, importance: 0.5}
  - {key: management_change, label: Management change, importance: 0.5}
  - {key: legal, label: Legal / litigation, importance: 0.5}
  - {key: divestment, label: Divestment, importance: 0.5}
  - {key: insider_trade, label: Insider trade, importance: 0.4}
  - {key: buyback, label: Share buyback, importance: 0.4}
  - {key: dividend, label: Dividend, importance: 0.3}
  - {key: product, label: Product launch, importance: 0.3}
  - {key: analyst_rating, label: Analyst rating change, importance: 0.3}
  - {key: other, label: Other, importance: 0.1}

# Defaults; the user can change these in Settings (stored in the settings table).
scoring_weights:
  news_volume: 0.35
  event_importance: 0.30
  sentiment_shift: 0.20
  market_reaction: 0.15

briefing:
  send_time: "07:00"
  timezone: Europe/Stockholm
  language: en
  max_stories: 5
  max_sectors: 3
  max_ideas: 3
