# Hourly news collection, tagging, scoring and the daily briefing.
# Free: public repos get unlimited Actions minutes.
# Needs repo secrets: DATABASE_URL, SEC_USER_AGENT, FINNHUB_API_KEY, GEMINI_API_KEY,
# TWELVE_DATA_API_KEY, EODHD_API_KEY, RESEND_API_KEY (or SMTP_*). Optional variable: APP_URL.
name: Collect news

on:
  schedule:
    - cron: "17 * * * *"  # off the hour; top-of-hour runs are often delayed
  workflow_dispatch:  # "Run workflow" button for testing
    inputs:
      rewrite_briefing:
        description: "Rewrite today's briefing (uses 1 of the 20 daily briefing requests)"
        type: boolean
        default: false
      send_test_email:
        description: "Email the latest briefing now, as a test (doesn't count as today's send)"
        type: boolean
        default: false

# Never run two collections at once.
concurrency:
  group: collect
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  collect:
    # Off until you add the repo variable COLLECT_ENABLED=true (after the secrets).
    if: ${{ vars.COLLECT_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
      FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
      EODHD_API_KEY: ${{ secrets.EODHD_API_KEY }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      EMAIL_PROVIDER: ${{ vars.EMAIL_PROVIDER || 'resend' }}
      EMAIL_FROM: ${{ vars.EMAIL_FROM }}
      SMTP_HOST: ${{ vars.SMTP_HOST }}
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      APP_URL: ${{ vars.APP_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.23"
          enable-cache: true
      - run: uv sync --frozen --no-dev
      - name: Apply database migrations
        run: uv run alembic upgrade head
      - name: Sync topic config
        run: uv run signal-desk sync-topic
      - name: Collect
        run: uv run signal-desk collect
      - name: Tag articles
        run: uv run signal-desk tag
      - name: Update prices
        run: uv run signal-desk prices
      - name: Track record
        run: uv run signal-desk evaluate-ideas
      - name: Score stocks
        run: uv run signal-desk score
      - name: Write morning briefing (once a day, after send time)
        run: uv run signal-desk briefing ${{ inputs.rewrite_briefing && '--force' || '--if-due' }}
      - name: Email the briefing (once, after it is written)
        run: uv run signal-desk send-briefing ${{ inputs.send_test_email && '--test' || '' }}
      - name: Prune untagged articles
        run: uv run signal-desk prune
